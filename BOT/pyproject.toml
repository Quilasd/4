[project]
name = "fantasy-world-bot"
version = "0.1.0"
description = "Multiplayer fantasy grand-strategy Telegram game"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.16,<2",
    "redis>=6,<7",
]

[project.scripts]
world-bot = "app.main:main"

[tool.ruff]
line-length = 100

automatic = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
